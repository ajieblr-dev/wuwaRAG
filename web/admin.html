<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin · Resonance Archive</title>
<link rel="stylesheet" href="/web/styles.css" />

</head>
<body>
<main id="content">
  <div class="wrap" style="max-width:460px;padding-block:72px 64px">
    <div class="row gap-3" style="margin-bottom:22px">
      <span class="feature-mark" style="width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--border);border-radius:10px;color:var(--accent)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
      </span>
      <div>
        <h1 class="display" style="font-size:26px">Maintainer console</h1>
        <p class="tiny dim">Resonance Archive · admin</p>
      </div>
    </div>

    <div class="card stack gap-4" id="gate-form" data-od-id="admin-gate">
      <div class="banner info" style="font-size:12.5px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        <div>Direct access enabled. Entering maintainer console…</div>
      </div>
      <div class="row gap-2">
        <a class="btn btn-primary grow" id="btn-enter" href="admin-overview.html">Open console</a>
        <a class="btn btn-ghost" href="index.html">Back to Home</a>
      </div>
    </div>
  </div>
</main>
<script src="/web/app.js"></script>
<script>
(function () {
  OD.mount("admin");
  OD.token = OD.SS.get("od-token") || "admin-session";
  OD.SS.set("od-token", OD.token);
  location.replace("admin-overview.html");
})();
</script>
</body>
</html>
