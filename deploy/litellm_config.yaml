model_list:
  # Primary Model: Google Gemini 3.1 Flash Lite
  - model_name: wuwa-lore-model
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 30

  # Secondary Gemini model fallback
  - model_name: wuwa-lore-gemini-pro
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 30

  # Fallback Model: Groq Llama 3.3 70B Versatile
  - model_name: wuwa-lore-fallback
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      rpm: 30

  # Direct alias mappings for individual testing
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: groq-llama
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # HuggingFace Embedding Model via LiteLLM
  - model_name: all-MiniLM-L6-v2
    litellm_params:
      model: huggingface/sentence-transformers/all-MiniLM-L6-v2
      api_key: os.environ/HUGGINGFACE_API_KEY

router_settings:
  # Automatic failover when primary encounters rate limits, timeouts, or quota errors
  fallbacks:
    - wuwa-lore-model: ["wuwa-lore-gemini-pro", "wuwa-lore-fallback"]
    - gemini-flash: ["groq-llama"]
  num_retries: 3
  timeout: 30
  retry_policy:
    RateLimitError: 3
    APIConnectionError: 2
    Timeout: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
